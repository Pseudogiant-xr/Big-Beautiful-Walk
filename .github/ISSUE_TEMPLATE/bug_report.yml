name: Bug report
description: Report a reproducible problem with Big Beautiful Walk.
body:
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: 0.7.0
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Game version and Steam build
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPU, driver and Windows version
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Rendering setup
      options:
        - Core DLSS SR only
        - Optional upscalers / Frame Generation bridge
        - Additional Neural Rendering setup
        - Other mods or injectors
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and expected behaviour
      description: Include the selected preset, the graphics API, and whether it also happens with Game defaults.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Paste only the relevant part of the log. Remove account identifiers and personal paths before posting.

name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Graphics logic
        run: dotnet run --project tests/GraphicsChecks.csproj -c Release
      - name: Vegetation override restoration
        run: dotnet run --project tests/VegetationRestoreChecks.csproj -c Release
      - name: Vegetation native collection boundary
        run: dotnet run --project tests/VegetationInteropChecks.csproj -c Release
      - name: INI preservation and configuration recovery
        run: dotnet run --project tests/BridgeChecks.csproj -c Release
      - name: Frame generation and neural rendering profiles
        run: dotnet run --project tests/FeatureChecks.csproj -c Release
      - name: Neural menu edit recovery
        run: dotnet run --project tests/FeatureMenuChecks.csproj -c Release
      - name: Embedded menu artwork and decode recovery
        run: |
          dotnet run --project tests/MenuThemeChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/MenuThemeChecks.csproj -c Release -- --reject
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/MenuThemeChecks.csproj -c Release -- --null-handle
      - name: Read-only performance capture lifecycle
        run: |
          foreach ($mode in @('', '--focus-event', '--boundary-stall')) {
            dotnet run --project tests/PerformanceCaptureChecks.csproj -c Release -- $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Optional small-plant caster requests
        run: |
          foreach ($mode in @('', '--root-cache', '--pointer-reuse', '--unload')) {
            dotnet run --project tests/SmallPlantChecks.csproj -c Release -- $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Actual shadow-pass producer snapshots
        run: dotnet run --project tests/ShadowPassProbeChecks.csproj -c Release
      - name: Full-resolution receiver bounds and read-only recording probe
        run: |
          foreach ($project in @('ShadowReceiverBoundsChecks', 'ShadowClipProjectionChecks', 'ShadowReceiverProbeChecks')) {
            dotnet run --project "tests/$project.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native observer exception-boundary regression
        run: dotnet run --project tests/NativeObserverBoundaryChecks.csproj -c Release
      - name: Saved bridge settings refresh
        shell: pwsh
        run: ./tests/Invoke-BridgeRefreshChecks.ps1
      - name: Installer recovery fixtures (Windows PowerShell)
        shell: powershell
        run: ./tests/Setup.Tests.ps1
      - name: Graphical installer launcher
        shell: pwsh
        run: ./tests/Launcher.Tests.ps1
      - name: Installer optional-feature selection (Windows PowerShell)
        shell: powershell
        run: ./tests/SetupSelection.Tests.ps1
      - name: Installer recovery fixtures (PowerShell 7)
        shell: pwsh
        run: ./tests/Setup.Tests.ps1
      - name: Installer optional-feature selection (PowerShell 7)
        shell: pwsh
        run: ./tests/SetupSelection.Tests.ps1
